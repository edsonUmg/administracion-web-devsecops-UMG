namespace: banca-prod
host: banca.local

api:
  image: banco-mibc-umg-api
  tag: "1.0.0"
  replicas: 2
  port: 8080
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits:   { cpu: 300m, memory: 192Mi }

db:
  image: postgres
  tag: 17-alpine
  storage: 1Gi
  name: banca
  user: banca_app
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 384Mi }

# Los secretos NO viven aquí. Se crean aparte (Fase 7: Vault).
secretName: banca-secretos
