apiVersion: v1
kind: Service
metadata:
  name: banca-api
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector: { app: banca-api }
  ports:
    - { name: http, port: 80, targetPort: {{ .Values.api.port }} }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: banca-api
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: banca-api }
  template:
    metadata:
      labels: { app: banca-api }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: {{ .Values.api.image }}:{{ .Values.api.tag }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.api.port }}
          env:
            - { name: PORT, value: "{{ .Values.api.port }}" }
            - { name: PGHOST, value: postgres }
            - { name: PGDATABASE, value: {{ .Values.db.name }} }
            - { name: PGUSER, value: {{ .Values.db.user }} }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: db-password }
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: admin-token }
          livenessProbe:
            httpGet: { path: /health/live, port: {{ .Values.api.port }} }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: {{ .Values.api.port }} }
            periodSeconds: 5
          lifecycle:
            preStop:
              exec: { command: ["/nodejs/bin/node", "-e", "setTimeout(()=>{},5000)"] }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
      terminationGracePeriodSeconds: 30
