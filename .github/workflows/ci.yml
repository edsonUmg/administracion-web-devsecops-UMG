name: CI DevSecOps
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Mínimo privilegio: solo lectura por defecto; cada job pide lo que necesita
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  IMAGE_NAME: banco-mibc-umg-api

jobs:
  # ---------- 1. Pruebas unitarias ----------
  test:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Instalar dependencias (reproducible)
        run: npm ci
        working-directory: app
      - name: Ejecutar pruebas
        run: npm test
        working-directory: app

  # ---------- 2. Detección de secretos ----------
  secrets:
    name: Secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # historial completo
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source=/repo --redact --verbose

  # ---------- 3. SAST ----------
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v5
      - name: Semgrep (falla ante hallazgos)
        run: |
          semgrep scan --metrics=off --error \
            --config p/javascript --config p/nodejs --config p/owasp-top-ten \
            app/src

  # ---------- 4. SCA ----------
  sca:
    name: SCA (npm audit + Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit (dependencias de producción)
        run: npm audit --omit=dev --audit-level=high
        working-directory: app
      - name: Trivy filesystem (vulnerabilidades en dependencias)
        run: |
          docker run --rm -v "$PWD:/work" aquasec/trivy:latest fs \
            --scanners vuln --severity HIGH,CRITICAL --exit-code 1 /work/app

  # ---------- 5. Seguridad de la IaC (Terraform + Helm + Dockerfile) ----------
  iac:
    name: IaC (Trivy config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Misconfiguraciones (informativo al inicio)
        run: |
          docker run --rm -v "$PWD:/work" aquasec/trivy:latest config \
            --severity HIGH,CRITICAL --exit-code 0 /work

  # ---------- 6. Build, escaneo, publicación, SBOM y firma ----------
  build:
    name: Imagen, Trivy, SBOM y Cosign
    needs: [test, secrets, sast, sca, iac]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # publicar en GHCR
      id-token: write   # identidad OIDC para Cosign keyless
    steps:
      - uses: actions/checkout@v5

      - name: Nombre de imagen en minúsculas (GHCR lo exige)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build local (multi-stage, distroless)
        uses: docker/build-push-action@v6
        with:
          context: app
          file: docker/Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy imagen (bloquea HIGH/CRITICAL con corrección disponible)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" \
            aquasec/trivy:latest image --severity HIGH,CRITICAL \
            --ignore-unfixed --ignorefile /work/.trivyignore --exit-code 1 "$IMAGE:scan"

      - name: SBOM (CycloneDX)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" \
            aquasec/trivy:latest image --format cyclonedx \
            --output /work/sbom.cdx.json "$IMAGE:scan"

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

      # --- Solo desde main: publicar y firmar ---
      - name: Login en GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagen
        id: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: app
          file: docker/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha

      - uses: sigstore/cosign-installer@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      - name: Firmar imagen (Cosign keyless) y adjuntar SBOM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "${IMAGE}@${DIGEST}"

      - name: Verificar firma (evidencia)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          {
            echo "### Imagen firmada"
            echo "- Imagen: \`${IMAGE}@${DIGEST}\`"
            echo "- Firma keyless verificada con identidad del workflow"
          } >> "$GITHUB_STEP_SUMMARY"
